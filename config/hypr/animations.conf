# ─────────────────────────────────────────────
#  АНИМАЦИИ — плавно, без перегруза
# ─────────────────────────────────────────────
animations {
    enabled = true

    # Кривые
    bezier = easeOut,  0.16, 1,    0.3,  1
    bezier = easeIn,   0.7,  0,    0.84, 0
    bezier = linear,   0,    0,    1,    1
    bezier = snap,     0.19, 1,    0.22, 1

    # Окна
    animation = windows,     1, 4, easeOut, slide
    animation = windowsOut,  1, 3, easeIn,  slide
    animation = windowsMove, 1, 3, snap

    # Рамки
    animation = border,      1, 5, linear

    # Рабочие столы
    animation = workspaces,  1, 4, easeOut, slide

    # Затухание
    animation = fade,        1, 4, easeOut
    animation = fadeOut,     1, 3, easeIn
}
