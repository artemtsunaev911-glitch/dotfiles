# ─────────────────────────────────────────────
#  HYPRLAND — главный конфиг
#  Подключает остальные файлы
# ─────────────────────────────────────────────

# Определяем профиль (записан install.sh при установке)

# Общие переменные окружения
source = ~/.config/hypr/envs/common.env

# GPU-специфичные переменные (подключается нужный файл)
# install.sh создаст симлинк ~/.config/hypr/envs/gpu.env -> nvidia.env или intel.env
source = ~/.config/hypr/envs/gpu.env

# Внешние файлы
source = ~/.config/hypr/looks.conf
source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/autostart.conf

# ─────────────────────────────────────────────
#  МОНИТОРЫ
#  На ПК — один монитор, предпочитаемое разрешение
#  На ноуте — встроенный дисплей
# ─────────────────────────────────────────────
monitor = , preferred, auto, 1

# ─────────────────────────────────────────────
#  ВВОД
# ─────────────────────────────────────────────
input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle   # Super+Space — смена раскладки

    follow_mouse = 1
    sensitivity  = 0
    accel_profile = flat

    touchpad {
        natural_scroll    = true
        disable_while_typing = true
        tap-to-click      = true
    }
}

# ─────────────────────────────────────────────
#  ОБЩИЕ НАСТРОЙКИ
# ─────────────────────────────────────────────
general {
    gaps_in  = 4
    gaps_out = 8

    border_size = 2

    # Цвета рамок (переопределяются темой)
# col.active_border   = rgba(89b4faee) rgba(cba6f7ee) 45deg
# col.inactive_border = rgba(313244aa)

    layout = dwindle
}

# ─────────────────────────────────────────────
#  РАЗНОЕ
# ─────────────────────────────────────────────
misc {
    disable_hyprland_logo  = true
    disable_splash_rendering = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    focus_on_activate        = true
}

dwindle {
}
