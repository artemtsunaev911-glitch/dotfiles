general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    color = rgba(220,220,220,1.0)
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    rounding = 12
    outer_color = rgba(137,180,250,0.8)
    inner_color = rgba(20,20,20,0.8)
    font_color = rgba(255,255,255,1.0)
    fade_on_empty = true
    placeholder_text = Password...
    position = 0, -80
    halign = center
    valign = center
}
