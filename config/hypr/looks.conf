# ─────────────────────────────────────────────
#  ВНЕШНИЙ ВИД: прозрачность, блюр, скругления
# ─────────────────────────────────────────────

decoration {
    # Скругления — никаких острых углов
    rounding = 10

    # Прозрачность окон
    active_opacity   = 0.95
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0

    # Тени
    shadow {
        enabled      = true
        range        = 20
        render_power = 3
        color        = rgba(1a1a2ecc)
    }

    # Блюр — "стеклянный" эффект за прозрачными окнами
    blur {
        enabled          = true
        size             = 8
        passes           = 3
        new_optimizations = true
        xray             = false
        noise            = 0.02
        contrast         = 0.9
        brightness       = 0.8
        popups           = true
    }
}
